[package]
name = "dungeon_elements"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A local-first campaign manager for tabletop RPGs"
license = "MIT"
repository = "https://github.com/NightMarethyu/dungeon_elements"

[dependencies]
iced = { version = "0.14", features = ["advanced", "svg"] }
resvg = "0.45"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
